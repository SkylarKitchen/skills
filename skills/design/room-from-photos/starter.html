<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Room Layouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{--paper:#fff;--ink:#141414;--ink-2:#5f5f5f;--ink-3:#8c8c8c;--rule:#e3e3e3;--accent:#1f4fd8;--fill:#a6c0f6;--mono:"Geist Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 Geist,-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{background:var(--paper);border:1px solid var(--rule);border-radius:2px;height:30px;padding:0 10px;font-size:12.5px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:hover{border-color:var(--ink-3)}
button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--rule);min-width:0}
header .t{min-width:0;flex:0 1 auto}
header h1{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
header .sub{font-size:12.5px;color:var(--ink-2)}
.tabs{display:flex;margin-left:auto;overflow-x:auto;scrollbar-width:none;flex:0 1 auto;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{height:auto;padding:5px 12px 6px;border-radius:0;margin-left:-1px;text-align:left;line-height:1.25;white-space:nowrap}
.tabs button:first-child{border-radius:2px 0 0 2px;margin-left:0}.tabs button:last-child{border-radius:0 2px 2px 0}
.tabs b{font-weight:600;margin-right:6px}
.tabs small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.tabs button.on small{color:#c9c9c9}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) 300px;min-height:0}
.pane{position:relative;min-height:0;min-width:0;border-right:1px solid var(--rule);overflow:hidden}
.pane canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.pane .lbl{position:absolute;left:12px;bottom:10px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);pointer-events:none}
.ctl{position:absolute;display:flex;gap:6px}
.ctl.tr{right:12px;top:10px}.ctl.br{right:12px;bottom:12px}
.ctl.tl{left:12px;top:10px;align-items:center;background:var(--paper);border:1px solid var(--rule);padding:4px 4px 4px 9px;border-radius:2px;font-size:12px;gap:8px}
.ctl.tl input{width:90px;accent-color:var(--ink)}
.seg{display:flex;gap:0}.seg button{border-radius:0;margin-left:-1px;padding:0 9px}.seg button:first-child{border-radius:2px 0 0 2px;margin-left:0}.seg button:last-child{border-radius:0 2px 2px 0}
#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.panel{overflow-y:auto;padding:4px 16px 24px;min-width:0}
.panel section{padding:12px 0;border-bottom:1px solid var(--rule)}
.panel section:last-child{border-bottom:0}
.panel h2{font-size:11px;font-family:var(--mono);font-weight:400;color:var(--ink-3);margin:0 0 6px}
.panel p{margin:0 0 8px}
.checks{list-style:none;margin:0 0 8px;padding:0}
.checks li{display:grid;grid-template-columns:14px 1fr;gap:4px;padding:2px 0}
.checks li i{width:8px;height:8px;margin-top:6px;border:1.5px solid var(--ink)}
.checks li.bad i{background:var(--ink)}
.checks li.ok i{border-color:var(--ink-3);border-radius:50%}
.checks li[data-k]{cursor:pointer}
.checks li[data-k]:hover span{text-decoration:underline;text-decoration-color:var(--rule)}
.metric{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.insp .nm{font-weight:600}.insp .sz{font-family:var(--mono);font-size:12px;color:var(--ink-2);margin:2px 0 8px}
.new{font-family:var(--mono);font-size:10.5px;background:var(--fill);padding:1px 5px;border-radius:2px;margin-left:6px;font-weight:400}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.gaps{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}
.fld{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--ink-2)}
.fld input{width:100%;height:30px;border:1px solid var(--rule);border-radius:2px;padding:0 8px;font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--paper)}
.fld input:focus{outline:none;border-color:var(--accent)}
.hint{color:var(--ink-2);font-size:12.5px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs button{height:auto;padding:0;width:84px;overflow:hidden;display:flex;flex-direction:column;align-items:stretch;text-align:left}
.thumbs img{width:100%;height:56px;object-fit:cover;display:block;background:#f4f4f4}
.thumbs span{font-size:11px;padding:3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumbs button.on{border-color:var(--accent);background:var(--paper);color:var(--ink);box-shadow:0 0 0 1px var(--accent)}
.tune{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.ctl.bl{left:12px;bottom:12px}
.sw{margin:0 0 10px}.sw:last-child{margin-bottom:0}
.swh{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-bottom:5px}
.swh .fv{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swl{display:flex;flex-wrap:wrap;gap:5px}
.swc{position:relative;width:22px;height:22px;padding:0;border:1px solid rgba(20,20,20,.14);border-radius:2px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink-3);background:var(--paper)}
.swc:hover{border-color:var(--ink-3)}
.swc.on{box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--ink)}
.swc input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.looks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.looks button{display:inline-flex;align-items:center;gap:7px}
.looks i{display:inline-flex}.looks i b{width:9px;height:14px;display:block}
.vars{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.vars button small{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-left:6px}
.vars button.on small{color:#c9c9c9}
.insp h3{font-size:11px;font-family:var(--mono);font-weight:400;color:var(--ink-3);margin:12px 0 6px}
.pieces button.on{background:var(--paper);color:var(--ink);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pieces button.add{color:var(--ink-2);border-style:dashed}
.facts{font-size:12.5px;color:var(--ink-2)}
.facts ul{margin:4px 0 0;padding-left:16px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12.5px;padding:7px 12px;border-radius:2px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:5}
.toast.on{opacity:1}
dialog{border:1px solid var(--rule);border-radius:2px;padding:14px;max-width:min(560px,92vw)}
dialog textarea{width:min(520px,84vw);height:200px;font:12px var(--mono);border:1px solid var(--rule);padding:8px}
.panetoggle{display:none}
@media (max-width:760px){
  .app{height:auto;display:block}
  header{flex-wrap:wrap;gap:8px}
  .tabs{margin-left:0;width:100%}
  .panetoggle{display:flex;width:100%}
  .panetoggle button{flex:1}
  .main{display:block}
  .pane{height:58vh;height:58svh;border-right:0;border-bottom:1px solid var(--rule)}
  body.m-plan #modelPane,body.m-model #planPane{display:none}
}
</style>
<body>
<div class="app">
<header>
  <div class="t"><h1 id="h1"></h1><div class="sub" id="sub"></div></div>
  <nav class="tabs" id="tabs" aria-label="Layout options"></nav>
  <div class="panetoggle seg" id="paneToggle"><button data-p="model" class="on">Model</button><button data-p="plan">Plan</button></div>
</header>
<div class="main">
  <div class="pane" id="planPane"><canvas id="plan"></canvas><span class="lbl">Plan · drag to move · R or double-click turns</span></div>
  <div class="pane" id="modelPane"><canvas id="model"></canvas><img id="photo" alt="" hidden>
    <div class="ctl tr seg" id="views"></div>
    <div class="ctl bl seg" id="lookCtl"><button data-l="colour">Colour</button><button data-l="white">White model</button></div>
    <div class="ctl br" id="zoomCtl"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="fit">Fit</button></div>
    <div class="ctl tl" id="photoBar" hidden><span id="phName"></span><input type="range" id="phOp" min="0" max="1" step="0.05" value="0.5" aria-label="Photo overlay"><button id="phExit">Back to model</button></div>
  </div>
  <aside class="panel">
    <section><h2 id="optH"></h2><p id="note"></p><ul class="checks" id="checks"></ul><div class="metric" id="metric"></div></section>
    <section class="insp" id="insp"></section>
    <section id="roomS"><h2>Room · this option</h2><div class="looks" id="looks"></div><div id="roomFin"></div></section>
    <section><h2>Pieces · tap one to change it</h2><div class="chips pieces" id="tray"></div></section>
    <section id="photosS"><h2>Photos · the model drawn over each one</h2><div class="thumbs" id="thumbs"></div><div class="tune" id="tune" hidden></div></section>
    <section class="facts" id="facts"></section>
    <section><div class="row"><button id="copy">Copy layout for Claude</button><button id="dup">Save as new option</button><button id="reset">Reset option</button></div></section>
  </aside>
</div>
</div>
<div class="toast" id="toast"></div>
<dialog id="dlg"><p>Copy this and paste it back to Claude:</p><textarea id="dlgT" readonly></textarea><div class="row"><button id="dlgX">Close</button></div></dialog>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.162.0/+esm';
import {RoomEnvironment} from 'https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/environments/RoomEnvironment.js/+esm';
import {RoundedBoxGeometry} from 'https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/geometries/RoundedBoxGeometry.js/+esm';
import {mergeGeometries} from 'https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/utils/BufferGeometryUtils.js/+esm';
import {TransformControls} from 'https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/controls/TransformControls.js/+esm';
import {EffectComposer} from 'https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/postprocessing/EffectComposer.js/+esm';
import {RenderPass} from 'https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/postprocessing/RenderPass.js/+esm';
import {GTAOPass} from 'https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/postprocessing/GTAOPass.js/+esm';
import {OutputPass} from 'https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/postprocessing/OutputPass.js/+esm';
/* ======================================================================
   CONFIG: the only block a project edits. Units are inches. The plan's x runs right, y runs down.
   ====================================================================== */
var CONFIG = {
  title: 'Kids’ room',
  subtitle: 'Where the new bed goes · three options',
  storageKey: 'room-starter-v1',          /* unique per page: edits and saved options live under it, per viewer */
  accent: 0x1f4fd8, fill: 0xa6c0f6,       /* accent = selection; fill = the new things in the white model */
  view: 'se', look: 'colour',             /* opening model view (se, sw, nw, ne, top) and look (colour or white) */
  /* Named swatches, grouped by material: sample them from the photos and the inspiration. Each finish offers the groups
     that suit it (walls and trim: paint; floor: wood; upholstery and rugs: fabric; case goods: wood and paint).
     A plain array works too and is offered everywhere. Colours are hex numbers (0xdfe4d8) or strings ('#dfe4d8'). */
  PALETTE: {
    paint: [['Warm white', 0xf4f1ea], ['Pale sage', 0xdfe4d8], ['Blush', 0xe8cfc4], ['Dusty blue', 0x9db2c4], ['Ochre', 0xc9a24f], ['Charcoal', 0x3e3f3d]],
    wood: [['Pale oak', 0xd8bb93], ['Light oak', 0xcfae86], ['Walnut', 0x8a6443]],
    fabric: [['Linen', 0xe9dfcc], ['Dusty blue', 0x9db2c4], ['Moss', 0x7f8c63], ['Blush', 0xe8cfc4], ['Terracotta', 0xd6aa98], ['Charcoal', 0x3e3f3d]]
  },
  /* One-click palettes for the whole room; each replaces the option's colours. {} = the room as configured below. */
  LOOKS: [
    {name: 'Sage and oak', colors: {}},
    {name: 'Warm white', colors: {walls: 0xf4f1ea, bed: [0xf4f1ea, 0x7f8c63], rug: [0xe8cfc4, 0xd6aa98]}},
    {name: 'Dusty blue', colors: {walls: 0x9db2c4, trim: 0xf4f1ea, bed: [0xf4f1ea, 0xe9dfcc], rug: [0xe9dfcc, 0xc9a24f]}}
  ],
  ROOM: {
    outline: [[0, 0], [138, 0], [138, 126], [0, 126]],   /* inner wall faces, clockwise from the top-left corner */
    height: 96, wall: 5,
    walls: 0xdfe4d8, floor: 0xcfae86, trim: 0xf4f1ea,    /* paint, flooring, and trim and doors */
    boards: 5, boardsDir: 'x',                           /* floorboard width in inches (0 = none) and the axis they run along */
    /* c = the opening's centre on its wall line. hinge = the jamb the door hangs on, seen from inside the room facing that wall.
       type 'opening' = a cased opening or closet; clear = inches to keep free in front of it */
    openings: [
      {type: 'window', c: [69, 0], width: 48, sill: 30, head: 80},
      {type: 'door', c: [118, 126], width: 32, hinge: 'left', swing: 'in'},
      {type: 'opening', c: [0, 96], width: 48, head: 80, clear: 24, label: 'Closet'}
    ],
    fixed: [],                            /* built-ins that never move: {id, name, type, c:[x,y], w, d, h, rot}; c = centre, rot as for items; type 'fireplace' */
    verify: ['Room 11′-6″ × 10′-6″, scaled from the 32″ door', 'Window sill at 30″', 'Closet opening 4′ wide']
  },
  /* w = width across the front, d = depth front to back, h = height. The front is the side you use: the bed's foot,
     a dresser's drawers, a desk's chair side. Types: bed crib dresser nightstand desk bookshelf wardrobe sofa armchair lounge chair table rug box ottoman petbed stands floorlamp floorplant art media.
     new:true = the thing being placed (drawn in the fill colour in the white model). front / side override the type's clearance in inches.
     color = the body (frame, carcass, top, upholstery); color2 = the second finish (bedding, desk and table legs, cushions, a rug's border).
     variants = the styles offered for the piece, each a label plus what it changes (w, d, h, type, color...); the first is the piece as given. */
  ITEMS: {
    bed:     {name: 'New bed', type: 'bed', w: 41, d: 80, h: 22, hb: 36, new: true, color: 0xf4f1ea, color2: 0x9db2c4,
              variants: [{label: 'Twin'}, {label: 'Twin XL', d: 85}, {label: 'Full', w: 56}]},
    dresser: {name: 'Dresser', type: 'dresser', w: 48, d: 19, h: 32, color: 0x8a6443},
    desk:    {name: 'Desk', type: 'desk', w: 42, d: 22, h: 29, color: 0xf4f1ea, color2: 0xcfae86},
    shelf:   {name: 'Bookshelf', type: 'bookshelf', w: 30, d: 12, h: 60, color: 0xd8bb93},
    stand:   {name: 'Nightstand', type: 'nightstand', w: 16, d: 16, h: 22, color: 0xc9a24f},
    rug:     {name: 'Rug', type: 'rug', w: 60, d: 84, color: 0xe9dfcc, color2: 0x9db2c4}
  },
  /* place: id → [x, y, rot]. x, y = the item's centre; rot = the wall its back faces: 0 top, 90 right, 180 bottom, 270 left (any angle works).
     colors (optional): this option's own palette: walls, floor, trim, paneling, or an item or built-in id → colour or [colour, colour2].
     variants (optional): item id → the variant's label or index. */
  LAYOUTS: [
    {name: 'Bed in the corner', note: 'The bed tucks into the top-left corner beside the window. Most open floor for play; only one side of the bed can be reached.',
     place: {bed: [40, 20.5, 270], desk: [127, 40, 90], dresser: [60, 116.5, 180], shelf: [132, 78, 90], rug: [70, 74, 90]}},
    {name: 'Bed centred', note: 'Headboard centred on the window wall with a nightstand. It reads as a proper bedroom, but it fills the middle of the room and the desk no longer fits.',
     place: {bed: [69, 40, 0], stand: [38, 8, 0], dresser: [74, 116.5, 180], shelf: [132, 78, 90], rug: [69, 90, 90]}},
    {name: 'Bed on the right wall', note: 'The bed runs down the right wall and the desk gets the window light. The dresser moves beside the closet; warm white walls with moss bedding and a blush rug.',
     place: {bed: [117.5, 40, 0], desk: [55, 11, 0], dresser: [9.5, 46, 270], shelf: [60, 120, 180], rug: [66, 75, 90]},
     colors: {walls: 0xf4f1ea, bed: [0xf4f1ea, 0x7f8c63], rug: [0xe8cfc4, 0xd6aa98]}}
  ],
  /* One camera per photo, so the page can draw the model over it: at = where the phone stood (plan x, y), h = lens height,
     yaw = compass of the view (0 looks up the plan, 90 right), pitch up +, roll clockwise +, fov = vertical degrees.
     src = the image path, label = its caption: {src: 'photos/door.jpg', label: 'From the door', at: [100, 120], h: 60, yaw: 0, pitch: 0, roll: 0, fov: 67}.
     The Photos panel has live fields for these; tune until the model's corners land on the photo's. */
  PHOTOS: []
};

(function(){
var T = THREE, C = CONFIG, R = C.ROOM;
var $ = function(s){ return document.querySelector(s); };
function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function css(h){ return '#' + ('00000' + h.toString(16)).slice(-6); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function hex(v){ return typeof v === 'string' ? parseInt(v.replace('#', ''), 16) : v; }
function pick(){ for (var i = 0; i < arguments.length; i++) if (arguments[i] != null) return hex(arguments[i]); }
function mix(h, k){ return 'rgb(' + [h >> 16 & 255, h >> 8 & 255, h & 255].map(function(v){ return Math.round(v + (255 - v) * k); }).join(',') + ')'; }   /* k of the way to white */
var INK = 0x141414, WHITE = 0xffffff, RUGC = 0xefefef, ACCENT = C.accent || 0x1f4fd8, FILL = C.fill || 0xa6c0f6, SEL = 0x86a6ef, POCHE = 0x2b2b2b;
var PALE = 'rgba(' + [FILL >> 16 & 255, FILL >> 8 & 255, FILL & 255].join(',') + ',.45)';
document.documentElement.style.setProperty('--accent', css(ACCENT)); document.documentElement.style.setProperty('--fill', css(FILL));
document.title = C.title; $('#h1').textContent = C.title; $('#sub').textContent = C.subtitle || '';
if (!/\bm-(model|plan)\b/.test(document.body.className)) document.body.classList.add('m-model');   /* phone: which pane shows */
var HASH = {}; (location.hash || '').slice(1).split('&').forEach(function(kv){ var p = kv.split('='); if (p[0]) HASH[p[0]] = decodeURIComponent(p[1] || '1'); });
var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- units ---------- */
function fmt(v){ var n = Math.round(Math.abs(v)), f = Math.floor(n / 12), i = n % 12; return (v < -0.5 ? '−' : '') + (f ? f + '′' + (i ? '-' + i + '″' : '') : i + '″'); }
function parseLen(s){ s = String(s).trim().replace(/[’′]/g, "'").replace(/[”″]/g, '"');
  var m = /^(-?\d+(?:\.\d+)?)\s*'\s*-?\s*(\d+(?:\.\d+)?)?\s*"?$/.exec(s); if (m) return parseFloat(m[1]) * 12 + (m[2] ? parseFloat(m[2]) : 0);
  m = /^(-?\d+(?:\.\d+)?)\s*(?:"|in)?$/.exec(s); return m ? parseFloat(m[1]) : NaN; }

/* ---------- 2D geometry (plan inches) ---------- */
function add(a, b){ return [a[0] + b[0], a[1] + b[1]]; } function sub(a, b){ return [a[0] - b[0], a[1] - b[1]]; }
function mul(a, k){ return [a[0] * k, a[1] * k]; } function dot(a, b){ return a[0] * b[0] + a[1] * b[1]; }
function len(a){ return Math.hypot(a[0], a[1]); } function norm(a){ var l = len(a) || 1; return [a[0] / l, a[1] / l]; }
function cross(a, b){ return a[0] * b[1] - a[1] * b[0]; }
function inPoly(p, P){ var c = false; for (var i = 0, j = P.length - 1; i < P.length; j = i++){ var a = P[i], b = P[j];
  if ((a[1] > p[1]) !== (b[1] > p[1]) && p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0]) c = !c; } return c; }
function proj(P, n){ var lo = Infinity, hi = -Infinity; P.forEach(function(p){ var v = dot(p, n); if (v < lo) lo = v; if (v > hi) hi = v; }); return [lo, hi]; }
function overlap(A, B){ /* separating axis test on convex polygons; touching (within half an inch) is not overlap */
  var polys = [A, B]; for (var k = 0; k < 2; k++){ var P = polys[k]; for (var i = 0; i < P.length; i++){ var e = sub(P[(i + 1) % P.length], P[i]); if (len(e) < 1e-6) continue;
